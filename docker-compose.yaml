version: "3.8"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    container_name: fastapi_app
    restart: always
    networks:
      - app_network
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:567234@db:5432/hw02"

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 567234
      POSTGRES_DB: hw02
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
