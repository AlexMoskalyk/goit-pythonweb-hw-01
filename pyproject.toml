[project]
name = "goit-pythonweb-hw-01"
version = "0.1.0"
description = ""
authors = [
    {name = "Oleksandr Moskalyk",email = "alex.moskalik@gmail.com"}
]

requires-python = ">=3.7,<3.11"
[tool.poetry.dependencies]
python = ">=3.7,<3.11"
fastapi = "0.115.11"
sqlalchemy = {version = "2.0.39", extras = ["asyncio"]}
alembic = "1.15.1"
asyncpg = "0.30.0"
pydantic-settings = "2.8.1"
greenlet = "3.1.1"
pydantic = {version = "2.10.6", extras = ["email"]}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
slowapi = "^0.1.9"
fastapi-mail = "^1.4.2"
cloudinary = "^1.43.0"
fastapi-cache = "^0.1.0"
pytest = "^8.3.5"
pytest-cov = "^6.1.0"
pytest-asyncio = "^0.26.0"
httpx = "^0.28.1"
pytest-mock = "^3.14.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
fastapi-cli = "^0.0.7"

